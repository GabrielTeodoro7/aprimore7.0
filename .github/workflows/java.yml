name: Verificação Java

on:
  push:
    branches:
      - main
      - refactor/java25-servlet61-migration
  pull_request:
    branches:
      - main

concurrency:
  group: aprimore-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, testar e validar JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validar backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Impedir retorno de arquivos TypeScript no frontend
        shell: bash
        run: |
          if find frontend -type f \\( -name '*.ts' -o -name '*.tsx' \\) -print -quit | grep -q .; then
            echo "::error::O frontend deve permanecer em HTML, CSS e JavaScript puro."
            exit 1
          fi
          if find . -path './.git' -prune -o -name 'package.json' -print -quit | grep -q .; then
            echo "::error::Não reintroduza um package.json de frontend nesta stack."
            exit 1
          fi
      - name: Validar sintaxe de todos os arquivos JavaScript
        shell: bash
        run: |
          find frontend/assets/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
